# systemd drop-in for telegraf — inject the InfluxDB token as an env var
# so /etc/telegraf/telegraf.conf can use `token = "${INFLUXDB_TOKEN}"`
# without the secret ever living in the (0644) config file.
#
# Installed by scripts/install-telegraf.sh to:
#   /etc/systemd/system/telegraf.service.d/env.conf
# The env file /etc/telegraf/telegraf.env is 0600 root; systemd (PID 1) reads
# it before dropping to the telegraf user, so the secret stays root-only.
[Service]
EnvironmentFile=/etc/telegraf/telegraf.env