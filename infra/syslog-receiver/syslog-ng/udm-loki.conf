###############################################################################
# /etc/syslog-ng/conf.d/udm-loki.conf
#
# UDM Pro syslog -> Loki forwarder (syslog-ng 4.x).
#
# Pipeline:
#   network(udp port=1514) -> file spool (/data/udm-pro/udm.log)
#                          -> http(Loki push)
#
# Why syslog-ng (vs rsyslog/Vector/Promtail):
#   - syslog-ng-mod-http is in Ubuntu 26.04's universe repo
#     (rsyslog-omhttp is not)
#   - Native RFC 3164 parsing (syslog-ng autodetects); no Promtail/Alloy
#     workaround needed
#   - Native http() destination
#   - Single daemon, native config, ~20 MB image
#
# Labels (RFC 3164 macros that syslog-ng auto-fills):
#   ${HOST}      -- hostname from the BSD header
#   ${PROGRAM}   -- tag from the BSD header
#   ${LEVEL}     -- severity name (info, warning, ...)
#   ${FACILITY}  -- facility text
#   ${MSG}       -- the body
#
# What we deliberately do NOT do here: parse [CATEGORY-SUB] from ${MSG}.
# Doing that in syslog-ng requires a patterndb file or the python parser,
# both of which add complexity we don't need. Instead, [CATEGORY-SUB] is
# pulled out via a LogQL regex in Grafana, OR by piping through Vector if
# we ever want it as Loki labels.
###############################################################################

@version: 4.8
@include "scl.conf"

# ---------------------------------------------------------------------------
# Source: UDP 1514 from UDM Pro
# ---------------------------------------------------------------------------
source s_udm_pro {
    network(
        ip("0.0.0.0")
        port(1514)
        transport("udp")
        # syslog-ng auto-detects RFC 3164 vs RFC 5424
    );
};

# ---------------------------------------------------------------------------
# Destination 1: local spool (backup, logrotate, debug)
# ---------------------------------------------------------------------------
destination d_udm_spool {
    file(
        "@@DATA_DIR@@/udm.log"
        template("${ISODATE} ${HOST} ${PROGRAM} [${LEVEL}/${FACILITY}] ${MSG}\n")
        create-dirs(yes)
        dir-perm(0755)
        file-perm(0644)
    );
};

# ---------------------------------------------------------------------------
# Destination 2: Loki HTTP push
# ---------------------------------------------------------------------------
destination d_udm_loki {
    http(
        url("@@LOKI_URL@@/loki/api/v1/push")
        method("POST")
        content-type("application/json")
        # Body template: build a Loki push payload with the RFC 3164 macros.
        # ${.udm.ns} is set in the log{} block below so every event has a
        # nanosecond timestamp (Loki requires a string of digits).
        body-template(
            "{\"streams\":[{\"stream\":{"
            "\"job\":\"udm-syslog\","
            "\"source\":\"udm-pro\","
            "\"host\":\"${HOST}\","
            "\"app\":\"${PROGRAM}\","
            "\"severity\":\"${LEVEL}\","
            "\"facility\":\"${FACILITY}\""
            "},\"values\":[["
            "\"${UNIXTIME}\","
            "\"${MSG}\""
            "]]}]}"
        )
        response-action("success" value("2[0-9][0-9]"))
        timeout(10)
        # Disk buffer for Loki outages -- safe even if the cluster is offline
        # for hours.
        disk-buffer(
            disk-buf-size(1048576)
            reliable(no)
            dir("@@DATA_DIR@@/disk-buffer")
        )
    );
};

# ---------------------------------------------------------------------------
# Log path
# ---------------------------------------------------------------------------
log {
    source(s_udm_pro);

    destination(d_udm_spool);
    destination(d_udm_loki);
};