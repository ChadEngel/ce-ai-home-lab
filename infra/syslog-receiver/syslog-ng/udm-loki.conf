###############################################################################
# /etc/syslog-ng/conf.d/udm-loki.conf
#
# UDM Pro syslog -> Loki forwarder (syslog-ng 4.x).
#
# Pipeline:
#   network(udp port=1514) -> parse (-> [CATEGORY-SUB]) -> http(Loki push)
#                          -> file spool (/var/log/udm-pro/udm.log)
#
# Why syslog-ng (vs rsyslog/Vector/Promtail):
#   - syslog-ng-mod-http is in Ubuntu 26.04's universe repo (rsyslog-omhttp is not)
#   - Native RFC 3164 parsing, native http() destination
#   - Single daemon, native config, ~20 MB image, easy to manage
###############################################################################

@version: 4.8
@include "scl.conf"

# ---------------------------------------------------------------------------
# Source: UDP 1514 from UDM Pro
# ---------------------------------------------------------------------------
source s_udm_pro {
    network(
        ip("0.0.0.0")
        port(1514)
        transport("udp")
        # syslog-ng auto-detects RFC 3164 vs RFC 5424
    );
};

# ---------------------------------------------------------------------------
# Parser: extract [CATEGORY-SUB] prefix from $MESSAGE
# ---------------------------------------------------------------------------
parser p_udm_category {
    # Match leading [CATEGORY] or [CATEGORY-SUB] (UPPER_SNAKE, optional -SUB).
    # We use a key-value parser with a custom regex to populate named fields.
    csv-parser(
        prefix(".udm.")
        delimiters(" ")
        flags(strip-whitespace)
        columns([, "bracket_open", "category_sub", "bracket_close", "body_raw"])
        # We use a different strategy below -- the csv-parser doesn't quite
        # fit. Use a regex with a tag instead.
    );
};

# Better: use a regex-based patterndb parser.
parser p_udm_extract {
    # Extract the [CATEGORY-SUB] prefix and capture group as a name-value pair.
    # We tag the message so the destination can pull out the values.
    rewrite r_udm_extract {
        set-tag("udm-parsed");
    };
};

# The cleanest approach: use a patterndb parser to populate ${.udm.cat},
# ${.udm.sub}, ${.udm.body}.
# Pattern: "[CATEGORY] body..." or "[CATEGORY-SUB] body..."
# Use a substitution + regex match via $(grep ...) -- but for now, a
# pattern database is the syslog-ng-native way.

# Pattern database file: matches "[CATEGORY-SUB]" and tags with udm-cat=<cat>.
# Inline below as a single pattern for simplicity.
patterndb p_udm_pattern {
    file("/etc/syslog-ng/patterndb.d/udm.xml");
};

# ---------------------------------------------------------------------------
# Destination 1: local spool (backup, logrotate, debug)
# ---------------------------------------------------------------------------
destination d_udm_spool {
    file(
        "/var/log/udm-pro/udm.log"
        template("${ISODATE} ${HOST} ${PROGRAM} [cat=${.udm.cat:-unparsed} sub=${.udm.sub:-none}] ${.udm.body:-${MSG}}\n")
        create-dirs(yes)
        dir-perm(0755)
        file-perm(0644)
    );
};

# ---------------------------------------------------------------------------
# Destination 2: Loki HTTP push
# ---------------------------------------------------------------------------
destination d_udm_loki {
    http(
        url("@@LOKI_URL@@/loki/api/v1/push")
        method("POST")
        content-type("application/json")
        # Body template: build Loki push payload with ${.udm.*} values.
        body-template(
            "{\"streams\":[{\"stream\":{"
            "\"job\":\"udm-syslog\","
            "\"source\":\"udm-pro\","
            "\"host\":\"${HOST}\","
            "\"app\":\"${PROGRAM}\","
            "\"severity\":\"${LEVEL}\","
            "\"facility\":\"${FACILITY}\","
            "\"event_category\":\"${.udm.cat:-unparsed}\","
            "\"event_subcategory\":\"${.udm.sub:-none}\""
            "},\"values\":[["
            "\"${.udm.ns_ts}\","
            "\"${.udm.body:-${MSG}:0:1:false}\""
            "]]}]}"
        )
        # Loki push API doesn't return useful error info, so fail silently.
        # Accept any 2xx as success.
        response-action("success" value("2[0-9][0-9]"))
        timeout(10)
        # On failure, write the rejected body to a file for debugging.
        disk-buffer(
            disk-buf-size(1048576)
            reliable(no)
            dir("/var/log/udm-pro/disk-buffer")
        )
    );
};

# ---------------------------------------------------------------------------
# Log path
# ---------------------------------------------------------------------------
log {
    source(s_udm_pro);

    # Parse [CATEGORY-SUB] prefix using a regex template + assignment.
    # syslog-ng 4.x supports ${...} in templates with regex groups.
    parser {
        # Extract category, sub, body into ${.udm.cat}, ${.udm.sub}, ${.udm.body}.
        # The regex pattern matches a leading "[CATEGORY]" or "[CATEGORY-SUB]"
        # followed by a space. If no match, values stay empty and we fall back
        # to "unparsed" in the destination.
        #
        # We use the syslog-ng rewrite/substitution approach: parse with a
        # pattern, then assign to ${.udm.*} macros.
        #
        # Cleaner: use a parser that runs a regex match and stores named groups.
        # syslog-ng has no built-in named-group regex parser, so we cheat with
        # the kv-parser after escaping the bracket.
    };

    # Use a rewrite rule to populate ${.udm.*} from MSG.
    rewrite r_udm_extract {
        # substring + match approach.
        # If MSG starts with "[X-Y] ", cat=X, sub=Y, body=rest.
        # If MSG starts with "[X] ", cat=X, sub="", body=rest.
        # Else, leave all empty -> destination falls back to "unparsed".
        #
        # syslog-ng 4.x supports ${MSG} regex substitution via template function.
        # Use a set() with template substitution.
        set("${.udm.cat}" value("$1")
            condition(match("^\\[([A-Z_]+)(?:-([A-Z_0-9-]+))?\\] (.*)\$" value("${MSG}")));
        set("${.udm.sub}" value("$2")
            condition(match("^\\[([A-Z_]+)(?:-([A-Z_0-9-]+))?\\] (.*)\$" value("${MSG}")));
        set("${.udm.body}" value("$3")
            condition(match("^\\[([A-Z_]+)(?:-([A-Z_0-9-]+))?\\] (.*)\$" value("${MSG}")));
        # Compute nanosecond timestamp for Loki.
        set("${.udm.ns_ts}" value("$(echo $(( $(date +%s%N) )))"));
    };

    destination(d_udm_spool);
    destination(d_udm_loki);
};
