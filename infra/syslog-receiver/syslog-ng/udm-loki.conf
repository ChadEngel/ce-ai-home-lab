###############################################################################
# /etc/syslog-ng/conf.d/udm-loki.conf
#
# UDM Pro syslog -> Loki forwarder (syslog-ng 4.x, Ubuntu 26.04).
#
# Pipeline:
#   network(udp port=1514) -> file spool (@@DATA_DIR@@/udm.log)
#                          -> http(Loki push)
#
# Why syslog-ng (vs rsyslog/Vector/Promtail):
#   - syslog-ng-mod-http is in Ubuntu's universe repo (rsyslog-omhttp is not)
#   - Native RFC 3164 parsing (syslog-ng autodetects); Promtail/Alloy are
#     RFC 5424-only and silently drop the UDM's RFC 3164 packets
#   - Native http() destination
#   - Single daemon, native config, ~20 MB image
#
# Labels (RFC 3164 macros syslog-ng fills in):
#   ${HOST}      hostname from the BSD header
#   ${PROGRAM}   tag from the BSD header
#   ${PRIORITY}  severity name (notice, info, warning, ...)
#   ${FACILITY}  facility text (user, daemon, ...)
#   ${MSG}       message body
#
# NOTE ON ESCAPING: UDM messages embed literal double quotes, e.g.
#   [LAN_LOCAL-RET-2147483647] DESCR="WAN_IN" IN=br30 OUT=eth0
# Interpolating ${MSG} straight into a JSON string produces INVALID JSON and
# Loki rejects the push. We therefore escape each value via
# `$(format-json --key X)` and strip the {"X":"..."} wrapper with substr().
# If you add a label, use the same pattern -- do not use ${VAR} directly in a
# JSON string unless you have verified it cannot contain a quote or backslash.
#
# NOTE ON BATCHING (this matters a lot):
#   The UDM emits ~100 events/sec. Without batching syslog-ng opens ONE HTTPS
#   connection PER MESSAGE, which cannot keep up -- the disk-buffer fills and
#   the pipeline silently backs up (symptoms: 'written' barely climbs while
#   'queued' grows, nothing appears in Loki).
#   batching is enabled via batch-lines()/batch-timeout(), and the payload is
#   assembled by:
#      body-prefix("{\"streams\":[")   <- constant, macros NOT expanded here
#      body(...)                        <- one stream object per message
#      body-suffix("]}")                <- closes streams array
#      delimiter(",")                  <- joins batched body() fragments
#   IMPORTANT: macros are NOT expanded inside body-prefix()/body-suffix().
#   Every macro (host/app/severity/timestamp) MUST live in body().
#
# NOTE ON TIMESTAMPS:
#   The UDM's RFC 3164 header carries LOCAL wall-clock time with NO timezone
#   field. syslog-ng parses it using the HOST's local timezone (see TZ below),
#   so the host must be set to the lab's timezone or every event lands hours
#   off and falls outside Grafana's query window. install.sh sets
#   `timedatectl set-timezone America/Chicago` for this reason.
#   The options{ time-zone(...) } below is belt-and-suspenders; the host TZ is
#   what actually governs RFC 3164 parsing.
#
# NOTE ON HOST: syslog-ng replaces ${HOST} with the local hostname unless
# keep-hostname(yes) is set (see options{} below). Without it every UDM event
# would be labelled host="<this-box>" instead of the UDM's own hostname.
#
# What we deliberately do NOT do: parse [CATEGORY-SUB] from ${MSG}. That needs
# a patterndb or the python parser. Instead it's pulled out with a LogQL regex
# in Grafana if needed. See README.
###############################################################################

@version: 4.4

options {
    # Keep the hostname from the received message instead of overwriting it
    # with this forwarder's own hostname.
    keep-hostname(yes);
    # Never do reverse DNS on the UDM's source address -- it's a LAN box and
    # a DNS stall here would back up the socket.
    use-dns(no);
    # Don't spam an internal() warning per unresolved name.
    stats(freq(0));
    # RFC 3164 timestamps are parsed using the host's local timezone (see
    # install.sh, which runs `timedatectl set-timezone`). This option is a
    # secondary hint for drivers that honour it.
    time-zone("America/Chicago");
};

# ---------------------------------------------------------------------------
# Source: UDP 1514 from UDM Pro
# ---------------------------------------------------------------------------
source s_udm_pro {
    network(
        ip("0.0.0.0")
        port(1514)
        transport("udp")
        # syslog-ng auto-detects RFC 3164 vs RFC 5424
    );
};

# ---------------------------------------------------------------------------
# Destination 1: local spool (backup, logrotate, debug)
# ---------------------------------------------------------------------------
destination d_udm_spool {
    file(
        "@@DATA_DIR@@/udm.log"
        template("${ISODATE} ${HOST} ${PROGRAM} [${PRIORITY}/${FACILITY}] ${MSG}\n")
        create-dirs(yes)
        dir-perm(0755)
        owner("syslog")
        group("adm")
        perm(0644)
    );
};

# ---------------------------------------------------------------------------
# Destination 2: Loki HTTP push
# ---------------------------------------------------------------------------
# Loki push API wants:
#   {"streams":[{"stream":{<labels>},"values":[["<ns_ts>","<line>"]]}]}
# Constraints handled here:
#   * ts is nanoseconds-since-epoch as a STRING. ${UNIXTIME} is seconds with a
#     fractional part; we take the integer seconds via substr() and append
#     nine zeros, giving second-resolution timestamps in ns units. Loki accepts
#     duplicate/sub-second-identical timestamps.
#   * Every interpolated value is JSON-escaped via format-json + substr.
#   * syslog-ng does NOT concatenate adjacent string literals -- the body must
#     be ONE quoted string, so the JSON below is written as a single logical
#     line with embedded escapes.
#   * headers() -- not content-type(); the http() driver in 4.8.1 has no
#     content-type option.
#   * No response-action() -- also absent in this build. Non-2xx responses
#     are treated as failures and retried via the disk-buffer.
destination d_udm_loki {
    http(
        url("@@LOKI_URL@@/loki/api/v1/push")
        method("POST")
        headers("Content-Type: application/json")
        # Batched payload assembly. See the BATCHING note at the top of this
        # file for why each piece is where it is -- in particular, macros are
        # NOT expanded in body-prefix()/body-suffix(), so all per-message
        # values (host/app/severity/timestamp/line) live in body().
        body-prefix("{\"streams\":[")
        body("{\"stream\":{\"job\":\"udm-syslog\",\"source\":\"udm-pro\",\"host\":\"$(substr $(format-json --key HOST) 9 -2)\",\"app\":\"$(substr $(format-json --key PROGRAM) 12 -2)\",\"severity\":\"$(substr $(format-json --key PRIORITY) 13 -2)\",\"facility\":\"$(substr $(format-json --key FACILITY) 13 -2)\"},\"values\":[[\"$(substr ${UNIXTIME} 0 10)000000000\",\"$(substr $(format-json --key MSG) 8 -2)\"]]}")
        body-suffix("]}")
        delimiter(",")
        timeout(10)
        # Must be explicit: syslog-ng does not batch by default, which caps
        # throughput at one HTTPS round-trip per log message.
        batch-lines(500)
        batch-timeout(5000)
        workers(1)
        # Disk buffer for Loki outages -- safe even if the cluster is offline
        # for hours. Lives on the separate /data volume so a full buffer can
        # never wedge the OS volume.
        disk-buffer(
            disk-buf-size(1073741824)
            reliable(no)
            dir("@@DATA_DIR@@/disk-buffer")
        )
    );
};

# ---------------------------------------------------------------------------
# Filter: drop the firewall default-deny spam
# ---------------------------------------------------------------------------
# The UDM's default-deny rule logs EVERY dropped packet with
#   DESCR="no rule description"
# That single signature is ~94% of all traffic (~100 events/sec), which would
# put ~2.3 GiB/day into Loki and bury the events that matter. The UDM's own
# `contents` filter cannot be used to suppress it: setting log_all_contents=false
# makes UniFi stop sending syslog ENTIRELY (verified -- traffic drops to zero),
# so filtering has to happen here on the receiver.
#
# We keep everything else: device/uplink state, DHCP, dnsmasq, auth, warnings,
# security detections, and any firewall event WITH a real rule description.
filter f_udm_not_fw_noise {
    not match("DESCR=\"no rule description\"" value("MSG"));
};

# ---------------------------------------------------------------------------
# Log path
# ---------------------------------------------------------------------------
log {
    source(s_udm_pro);

    # Local spool gets everything unfiltered -- it is the forensic copy and
    # is cheap (rotated 7 days). Only the Loki path is filtered.
    destination(d_udm_spool);

    filter(f_udm_not_fw_noise);
    destination(d_udm_loki);
};
