# Open WebUI — main LLM chat UI.
#
# Connection target (live): Bifrost AI gateway (OpenAI-compatible)
#   OPENAI_API_BASE_URL - from Infisical secret OPENWEBUI_OLLAMA_BASE_URL
#     (synced into K8s Secret openwebui-secrets). MUST end in /v1, e.g.
#     https://llm.caehomelab.com/v1 — Bifrost serves /v1/* only.
#   OPENAI_API_KEY      - from Infisical secret BIFROST_OLLAMA_KEY (synced into
#     K8s Secret bifrost-secrets as BIFROST_API_KEY). Same key Bifrost reads
#     as its gateway key, so the hop is authenticated once enforcement is on.
#
# IMPORTANT: Bifrost speaks the OpenAI API (/v1/models, /v1/chat/completions),
# NOT the Ollama API (/api/tags). So Open WebUI MUST reach it via the OpenAI
# connection (OPENAI_API_BASE_URL), not via OLLAMA_BASE_URL. Pointing
# OLLAMA_BASE_URL at Bifrost yields an empty model list because Open WebUI
# then calls /api/tags, which Bifrost does not implement.
#
# To switch to direct external Ollama (bypassing Bifrost), set
#   OLLAMA_BASE_URL=http://aiserver.home:11434
# and remove the OPENAI_API_BASE_URL / OPENAI_API_KEY entries.
#
# CAVEAT — admin Connections UI overrides env vars:
# Open WebUI persists the OpenAI connection (api_base_urls, api_keys,
# api_configs) in its DB (config table, id=1, key "openai") the first time an
# admin saves Settings -> Connections, and that DB config TAKES PRECEDENCE over
# these env vars. For Infisical to remain the single source of truth for the
# URL/key, the DB "openai" entry must be kept as {"enable": true} ONLY (no
# api_base_urls / api_keys / api_configs). If the UI starts showing no models,
# reset it: in the pod, set config.openai back to {"enable": true} and restart.
# (api_configs["0"].enable=false or a typo'd URL here are the usual culprits.)
#
# See clusters/util-server/applications/openwebui/bifrost-config.yaml for
# the leftover ConfigMap from the LiteLLM era — it is NOT referenced by
# this Deployment and can be deleted (kubectl delete cm -n ai openwebui-bifrost-config).

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

apiVersion: v1
kind: Service
metadata:
  name: openwebui
  namespace: ai
spec:
  selector:
    app: openwebui
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP

---
# Static PV bound to the SAME NFS directory the old `openwebui-pvc` used, so
# uploaded files / RAG data (and the retired webui.db) carry over untouched.
# Access mode is now ReadWriteMany because openwebui runs 2 replicas on
# different nodes. The SQLite DB itself is retired in favour of Postgres
# (DATABASE_URL), so the shared directory no longer has a single-writer
# constraint — it only holds files now.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: openwebui-data-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.30.121
    path: /data/pod_data/ai-openwebui-pvc-pvc-71c08885-7aaf-430a-aa96-b2937089a689
  claimRef:
    namespace: ai
    name: openwebui-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwebui-data
  namespace: ai
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  volumeName: openwebui-data-pv
  resources:
    requests:
      storage: 5Gi

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openwebui-ingress
  namespace: ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    # Long timeouts for LLM generation streaming (Bifrost can take minutes)
    traefik.ingress.kubernetes.io/protocol: http
    traefik.ingress.kubernetes.io/response-forwarding-headers: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ai.caehomelab.com
      secretName: openwebui-tls
  rules:
    - host: ai.caehomelab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openwebui
                port:
                  number: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: ai
  labels:
    app: openwebui
spec:
  replicas: 2
  # State is in shared Postgres now, so replicas are interchangeable and we can
  # roll. (Was: replicas 1 + Recreate, because SQLite webui.db on an RWO PVC
  # cannot take two writers.)
  strategy:
    type: RollingUpdate
    # maxSurge 0: the work-horse nodes cannot fit a *surge* copy of this pod
    # (1 CPU / 2Gi request) while the previous replica is still running. Without
    # this the rollout deadlocks (2nd new pod Pending on Insufficient memory)
    # and the old pod is never released. Replace-then-start = a short single-
    # replica window during rollouts, which is fine for a UI.
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      affinity:
        # Spread the two replicas across the work-horse nodes (soft, so one
        # worker being down never blocks scheduling). Replaces the old
        # "prefer caelx002" pin — util-server is control-plane + data-layer only
        # now (it carries the control-plane taint).
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: openwebui
      containers:
        - name: openwebui
          # Track upstream releases: `latest` tag + Always pull. Pod restarts
          # (or `kubectl rollout restart`) pick up the newest Open WebUI
          # build — no deliberate version bumps needed. Trade-off: the
          # running version can drift from git (whatever :latest was at last
          # pod creation); check `ai.caehomelab.com` version in-app.
          image: ghcr.io/open-webui/open-webui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: WEBUI_NAME
              value: "Open WebUI"
            # Bifrost is an OpenAI-compatible gateway, so Open WebUI must use
            # the OpenAI connection — NOT OLLAMA_BASE_URL (Bifrost has no /api/tags).
            # Base URL comes from Infisical (OPENWEBUI_OLLAMA_BASE_URL) via the
            # openwebui-secrets sync. MUST include the /v1 suffix — Bifrost serves
            # the OpenAI API at /v1/* only; without /v1 Open WebUI hits the HTML UI.
            - name: OPENAI_API_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: openwebui-secrets
                  key: OPENAI_API_BASE_URL
            # Bearer key Open WebUI sends to Bifrost. Same Infisical secret
            # (BIFROST_OLLAMA_KEY) that Bifrost reads as BIFROST_API_KEY, so the
            # OpenWebUI->Bifrost hop is authenticated with the key Bifrost expects
            # once gateway-key enforcement is enabled in the Bifrost UI. A non-empty
            # value also ENABLES Open WebUI's OpenAI mode.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: BIFROST_API_KEY
            # RAG settings to avoid slow embedding downloads on cold start
            - name: HF_HUB_OFFLINE
              value: "1"
            # --- SQLite journal mode ------------------------------------------------
            # --- shared Postgres (replaces SQLite webui.db) ------------------------
            # Removes the SQLite single-writer constraint, which is what allows
            # the app to run 2 replicas. URL comes from the postgres-secrets sync.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: OPENWEBUI_DATABASE_URL
            # --- shared JWT signing key ------------------------------------------
            # Both replicas MUST sign/verify JWTs with the same key, or tokens
            # issued by one pod are rejected by the other (401 after login).
            # Without this env var Open WebUI generates a local key per pod
            # (.webui_secret_key in the container filesystem, not the shared PVC),
            # which is exactly what produced the login-loop bug.
            # Value comes from Infisical (OPENWEBUI_SECRET_KEY) via the
            # openwebui-secrets-sync CrD → K8s Secret openwebui-secrets[WEBUI_SECRET_KEY].
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openwebui-secrets
                  key: WEBUI_SECRET_KEY
                  optional: true
            # --- shared Redis (socket.io adapter) ---------------------------------
            # Multi-replica websockets need a shared adapter: without it a client's
            # socket lands on one replica while HTTP requests round-robin to the
            # other, which breaks streaming chat responses.
            - name: WEBSOCKET_REDIS_URL
              value: redis://redis.ai.svc.cluster.local:6379/1
          resources:
            requests:
              cpu: 1
              memory: 2Gi
            limits:
              cpu: "3"
              memory: 4Gi
          # /health returns 200 without auth once the backend is up.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: openwebui-data
              mountPath: /app/backend/data
      volumes:
        - name: openwebui-data
          persistentVolumeClaim:
            claimName: openwebui-data
