apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - kustomization.yaml

labels:
  - pairs:
      app: openwebui
    includeSelectors: true
    includeTemplateLabels: true

patches:
  # NOTE: this overlay is aspirational — the base `kustomization.yaml` is a
  # plain multi-doc manifest applied with `kubectl apply -f` (it has no
  # `resources:` field), so `kustomize build` cannot consume it yet. Fix the
  # YAML here now so the overlay is correct once the base is split into
  # buildable resource files. The patch below also lacked the space after
  # `-` (parsed as keys "-op"/"-path"/"-value") — fixed 2026-08.
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: openwebui