# Loki log aggregation stack (Loki single-binary + Promtail syslog intake).
#
# What this deploys:
#   1. Loki 3.7.4 single-binary (filesystem storage on NFS, 15-day retention)
#   2. Promtail 3.6.11 with a UDP syslog receiver, exposed as a NodePort so the
#      UDM Pro can stream logs into the cluster
#   3. TLS ingress at https://loki.caehomelab.com (cert-manager + letsencrypt-prod,
#      wildcard *.caehomelab.com -> 192.168.30.217 resolves automatically)
#
# Architecture:
#   UDM Pro --(syslog UDP)--> 192.168.30.217:30014 (NodePort)
#          --> promtail:1514/udp --> loki:3100/loki/v1/push
#   Grafana queries Loki via the in-cluster Service (http://loki.ai.svc:3100);
#   the public SSL endpoint is for the browser/Loki UI only.
#
# Retention: limits_config.retention_period = 360h (15 days). The compactor
# (retention_enabled: true, runs in-process in the single binary) sweeps the
# TSDB index and deletes chunks older than 15 days so the NFS PVC doesn't
# grow unbounded.
#
# NB: the ingress is LAN-only (DNS resolves to the private IP 192.168.30.217),
# matching the rest of the cluster. Loki's auth_enabled is false -- add a
# traefik basic-auth middleware on the ingress if you want to protect the
# public-LAN UI.
#
# Apply: ./scripts/deploy-loki.sh   (or kubectl apply -f kustomization.yaml -n ai)

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: ai
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9095

    common:
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules

    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      tsdb_shipper:
        active_index_directory: /var/loki/tsdb-active
        cache_location: /var/loki/tsdb-cache
      filesystem:
        directory: /var/loki/chunks

    # 15-day retention. The compactor (retention_enabled below) deletes
    # chunks older than retention_period during its sweep.
    limits_config:
      retention_period: 360h
      reject_old_samples: false

    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      compaction_interval: 10m

    analytics:
      reporting_enabled: false

---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: ai
spec:
  type: ClusterIP
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
    - name: grpc
      port: 9095
      targetPort: 9095

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-pvc
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: ai
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      nodeSelector:
        kubernetes.io/hostname: caelx002
      containers:
        - name: loki
          image: grafana/loki:3.7.4
          imagePullPolicy: IfNotPresent
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - name: http
              containerPort: 3100
            - name: grpc
              containerPort: 9095
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 10
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: storage
              mountPath: /var/loki
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: storage
          persistentVolumeClaim:
            claimName: loki-pvc

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loki-ingress
  namespace: ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - loki.caehomelab.com
      secretName: loki-tls
  rules:
    - host: loki.caehomelab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loki
                port:
                  number: 3100

---
# Promtail: receives UDM syslog over UDP and pushes to Loki.
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: ai
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.ai.svc.cluster.local:3100/loki/v1/push

    scrape_configs:
      - job_name: udm-syslog
        syslog:
          listen_address: "0.0.0.0:1514"
          listen_protocol: "udp"
          use_incoming_timestamp: true
          use_rfc5424_message: true
        relabel_configs:
          - source_labels: [__syslog_message_hostname]
            target_label: host
          - source_labels: [__syslog_message_app_name]
            target_label: app
          - source_labels: [__syslog_message_facility]
            target_label: facility
          - source_labels: [__syslog_message_severity]
            target_label: severity
          - source_labels: [__syslog_message_proc_id]
            target_label: proc_id

---
# NodePort UDP exposing promtail's syslog receiver to the LAN.
# UDM Pro -> Settings -> System Settings -> Advanced -> Syslog Server:
#   Host: 192.168.30.217   Port: 30014   Protocol: UDP
apiVersion: v1
kind: Service
metadata:
  name: promtail-syslog
  namespace: ai
spec:
  type: NodePort
  selector:
    app: promtail
  ports:
    - name: syslog-udp
      port: 1514
      protocol: UDP
      targetPort: 1514
      nodePort: 30014

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promtail
  namespace: ai
  labels:
    app: promtail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      # Pin to the control-plane node so the UDM's syslog target (the
      # util-server NodePort IP) lands on a local pod -- no cross-node UDP
      # hop, and intake survives a worker outage.
      nodeSelector:
        kubernetes.io/hostname: util-server
      containers:
        - name: promtail
          image: grafana/promtail:3.6.11
          imagePullPolicy: IfNotPresent
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          ports:
            - name: syslog-udp
              containerPort: 1514
              protocol: UDP
            - name: http
              containerPort: 9080
          readinessProbe:
            httpGet:
              path: /ready
              port: 9080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
              readOnly: true
            - name: positions
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: positions
          emptyDir: {}