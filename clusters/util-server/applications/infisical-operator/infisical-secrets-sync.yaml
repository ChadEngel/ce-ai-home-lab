# InfisicalSecret CRs — the Infisical Kubernetes Operator syncs these
# Infisical secrets into native Kubernetes Secrets that pods consume.
#
# Prerequisites:
#   1. Operator installed:  see install-secrets-operator.yaml
#   2. Machine Identity "homelab-k8s-operator" exists in Infisical with
#      Universal Auth (clientId/clientSecret) and Viewer role on the
#      `secret-management` project / `prod` environment.
#   3. K8s Secret `infisical-universal-auth` in namespace `ai` holds the
#      clientId/clientSecret. Created out-of-band:
#
#        kubectl create secret generic infisical-universal-auth -n ai \
#          --from-literal=clientId=<id> --from-literal=clientSecret=<secret>
#
# Auth model: Universal Auth (single Machine Identity). secretsPath "/"
# with recursive=false reads only the secrets at the root path, where all
# keys live. Each InfisicalSecret uses template.data to write ONLY the key
# the target K8s Secret needs (least-privilege), remapped to the K8s
# Secret key name the consumer expects.
#
# To add a new Infisical-managed secret: add it in the Infisical UI at
# secret-management / prod / path "/", then add a managedKubeSecretReferences
# entry (or a new InfisicalSecret) here that maps it to a K8s Secret.

---
# Sync CLOUDFLARE_API_TOKEN -> cert-manager/cloudflare-dns-creds[CF_API_TOKEN]
# Consumed by: cert-manager ClusterIssuer letsencrypt-prod (DNS-01 solver).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: cloudflare-dns-creds-sync
  namespace: ai
spec:
  hostAPI: https://secrets.caehomelab.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: ai
      secretsScope:
        projectSlug: caehomelab-v1q6
        envSlug: prod
        secretsPath: "/"
        recursive: false
  managedKubeSecretReferences:
    - secretName: cloudflare-dns-creds
      secretNamespace: cert-manager
      creationPolicy: Owner
      template:
        data:
          CF_API_TOKEN: "{{ .CLOUDFLARE_API_TOKEN.Value }}"

---
# Sync INFLUXDB_READ_TOKEN -> ai/influxdb-secrets[INFLUX_TOKEN]
# Consumed by: Grafana (datasource InfluxDB auth token via init-container
# envsubst). This is a READ-ONLY, all-buckets InfluxDB token so Grafana can read
# kube_metrics, mac_metrics, and network_metrics but cannot write.
#
# The WRITE token is a SEPARATE Infisical secret, INFLUXDB_TOKEN, consumed by
# the metrics writer on the util-server (scripts/monitor_k3s_health.sh fetches
# it via `infs get INFLUXDB_TOKEN`) and by unpoller (writes network_metrics).
# Do NOT reuse INFLUXDB_TOKEN here — that token is write-only and would make
# Grafana unable to read any bucket. Keep the read (INFLUXDB_READ_TOKEN) and
# write (INFLUXDB_TOKEN) tokens separate.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: influxdb-secrets-sync
  namespace: ai
spec:
  hostAPI: https://secrets.caehomelab.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: ai
      secretsScope:
        projectSlug: caehomelab-v1q6
        envSlug: prod
        secretsPath: "/"
        recursive: false
  managedKubeSecretReferences:
    - secretName: influxdb-secrets
      secretNamespace: ai
      creationPolicy: Owner
      template:
        data:
          INFLUX_TOKEN: "{{ .INFLUXDB_READ_TOKEN.Value }}"

---
# Sync INFLUXDB_TOKEN (WRITE) + UDM_API_KEY -> ai/unpoller-secrets
# Consumed by: unpoller (clusters/util-server/applications/unpoller). The
# INFLUXDB_TOKEN here is the WRITE-only token (scoped to kube_metrics and
# network_metrics); unpoller writes UniFi network metrics into network_metrics.
# This is intentionally a DIFFERENT token from influxdb-secrets[INFLUX_TOKEN],
# which is the read-only INFLUXDB_READ_TOKEN used by Grafana. Keeping them in
# separate K8s secrets prevents any pod from accidentally getting the wrong
# (read vs write) capability. UDM_API_KEY authenticates unpoller to the UniFi
# controller (UniFi OS API-key auth; exclusive of user/pass).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: unpoller-secrets-sync
  namespace: ai
spec:
  hostAPI: https://secrets.caehomelab.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: ai
      secretsScope:
        projectSlug: caehomelab-v1q6
        envSlug: prod
        secretsPath: "/"
        recursive: false
  managedKubeSecretReferences:
    - secretName: unpoller-secrets
      secretNamespace: ai
      creationPolicy: Owner
      template:
        data:
          INFLUXDB_TOKEN: "{{ .INFLUXDB_TOKEN.Value }}"
          UDM_API_KEY: "{{ .UDM_API_KEY.Value }}"

---
# Sync BIFROST_OLLAMA_KEY -> ai/bifrost-secrets[BIFROST_API_KEY]
# Consumed by:
#   - Bifrost: its gateway API key (BIFROST_API_KEY env). Enable enforcement
#     in the Bifrost UI to require it from clients.
#   - Open WebUI: sent as the OpenAI bearer key (OPENAI_API_KEY env, via
#     secretKeyRef on this same secret/key) so the OpenWebUI->Bifrost hop is
#     authenticated with the same key Bifrost expects.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: bifrost-secrets-sync
  namespace: ai
spec:
  hostAPI: https://secrets.caehomelab.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: ai
      secretsScope:
        projectSlug: caehomelab-v1q6
        envSlug: prod
        secretsPath: "/"
        recursive: false
  managedKubeSecretReferences:
    - secretName: bifrost-secrets
      secretNamespace: ai
      creationPolicy: Owner
      template:
        data:
          BIFROST_API_KEY: "{{ .BIFROST_OLLAMA_KEY.Value }}"

---
# Sync OPENWEBUI_OLLAMA_BASE_URL -> ai/openwebui-secrets[OPENAI_API_BASE_URL]
# Consumed by: Open WebUI (OPENAI_API_BASE_URL env via secretKeyRef) — the
# OpenAI-compatible base URL of the Bifrost gateway.
# NOTE: the value MUST include the /v1 suffix (e.g. https://llm.caehomelab.com/v1).
# Bifrost serves the OpenAI list/models at /v1/* only; without /v1 Open WebUI
# would hit the Bifrost HTML UI and see no models.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: openwebui-secrets-sync
  namespace: ai
spec:
  hostAPI: https://secrets.caehomelab.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: ai
      secretsScope:
        projectSlug: caehomelab-v1q6
        envSlug: prod
        secretsPath: "/"
        recursive: false
  managedKubeSecretReferences:
    - secretName: openwebui-secrets
      secretNamespace: ai
      creationPolicy: Owner
      template:
        data:
          OPENAI_API_BASE_URL: "{{ .OPENWEBUI_OLLAMA_BASE_URL.Value }}"
          WEBUI_SECRET_KEY: "{{ .OPENWEBUI_SECRET_KEY.Value }}"

---
# Sync UDM_SSH_PASS (UDM root SSH password) + INFLUXDB_TOKEN (WRITE) ->
# ai/udm-thermal-secrets. Consumed by: the udm-thermal collector
# (clusters/util-server/applications/udm-thermal) — SSHes to the UDM as root to
# read the SoC thermal zone (thermal_zone0) + fan RPM that unpoller cannot see,
# then writes a `udm_thermal` measurement into the `network_metrics` bucket.
# INFLUXDB_TOKEN here is the WRITE-only token (same as unpoller uses); the read
# token (INFLUX_TOKEN, in influxdb-secrets) is deliberately NOT used by a
# writer. UDM_SSH_PASS is the UniFi OS root password set under Settings ->
# System -> Advanced -> SSH.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: udm-thermal-secrets-sync
  namespace: ai
spec:
  hostAPI: https://secrets.caehomelab.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: ai
      secretsScope:
        projectSlug: caehomelab-v1q6
        envSlug: prod
        secretsPath: "/"
        recursive: false
  managedKubeSecretReferences:
    - secretName: udm-thermal-secrets
      secretNamespace: ai
      creationPolicy: Owner
      template:
        data:
          UDM_SSH_PASS: "{{ .UDM_SSH_PASS.Value }}"
          INFLUXDB_TOKEN: "{{ .INFLUXDB_TOKEN.Value }}"

---
# Sync PUSHOVER_USER_KEY + PUSHOVER_API_TOKEN -> ai/pushover-secrets
# Consumed by: the pushover-bridge (clusters/util-server/applications/
# pushover-bridge) — a tiny webhook that Grafana alerting POSTs to, which
# forwards to api.pushover.net for iOS push notifications. Grafana has no
# native Pushover integration, so an internal webhook bridge delivers it. See
# pushover.net -> Applications to create the API token.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: pushover-secrets-sync
  namespace: ai
spec:
  hostAPI: https://secrets.caehomelab.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: ai
      secretsScope:
        projectSlug: caehomelab-v1q6
        envSlug: prod
        secretsPath: "/"
        recursive: false
  managedKubeSecretReferences:
    - secretName: pushover-secrets
      secretNamespace: ai
      creationPolicy: Owner
      template:
        data:
          PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY.Value }}"
          PUSHOVER_API_TOKEN: "{{ .PUSHOVER_API_TOKEN.Value }}"

---
# Sync INFLUXDB_TOKEN (WRITE) -> ai/synthetic-monitor-secrets
# Consumed by: the synthetic-monitor probe (clusters/util-server/applications/
# synthetic-monitor) which periodically HTTP-checks InfluxDB / Bifrost /
# Open WebUI / Ollama from inside the cluster and writes a `service_health`
# measurement to kube_metrics. Same WRITE token as the other collectors.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: synthetic-monitor-secrets-sync
  namespace: ai
spec:
  hostAPI: https://secrets.caehomelab.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: ai
      secretsScope:
        projectSlug: caehomelab-v1q6
        envSlug: prod
        secretsPath: "/"
        recursive: false
  managedKubeSecretReferences:
    - secretName: synthetic-monitor-secrets
      secretNamespace: ai
      creationPolicy: Owner
      template:
        data:
          INFLUXDB_TOKEN: "{{ .INFLUXDB_TOKEN.Value }}"