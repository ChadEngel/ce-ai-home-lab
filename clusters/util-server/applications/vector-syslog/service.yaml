# NodePort 30015 (UDP) -> 1514. This is the new syslog receiver port.
# Repoint the UDM from promtail's 30014 -> here. Once verified, remove
# the promtail-* resources.
apiVersion: v1
kind: Service
metadata:
  name: vector-syslog
  namespace: ai
  labels:
    app: vector-syslog
spec:
  type: NodePort
  selector:
    app: vector-syslog
  ports:
    - name: syslog-udp
      port: 1514
      targetPort: syslog-udp
      nodePort: 30015
      protocol: UDP
