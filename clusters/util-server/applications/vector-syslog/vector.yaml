# Vector pipeline for UDM Pro remote syslog -> Loki.
#
# Why Vector (vs Promtail/Alloy): both Promtail and Alloys loki.source.syslog
# parser is locked to RFC 5424, but the UDM sends RFC 3164 (BSD) syslog:
#
#   <13>Sep 27 09:05:54 9050-Network 9050-Network [LAN_LOCAL-RET-...] DESCR=...
#
# Vector's `syslog` source mis-parses `[LAN_LOCAL-RET-...]` as RFC 5424
# structured data (syslog_loose auto-detects), mangling the event. So we use
# the raw `socket` (UDP) source and parse RFC 3164 ourselves in VRL.

# ---- Sources -----------------------------------------------------------------
sources:
  udm_raw:
    type: socket
    address: "0.0.0.0:1514"
    mode: udp
    max_length: 8192
    decoding:
      codec: bytes

# ---- Transforms: parse RFC 3164 + label for Loki ----------------------------
# RFC 3164 line format: <PRI>TIMESTAMP HOSTNAME TAG[PID]: MESSAGE
# UDM example:          <13>Sep 27 09:05:54 9050-Network 9050-Network [LAN_LOCAL-RET-2147483647] DESCR="..." IN=br30 OUT=eth0
# Note: UDM TAG is repeated, no `:`, and the "MSG" starts with `[CATEGORY-SUB]`.

transforms:
  udm_parse_rfc3164:
    type: remap
    inputs:
      - udm_raw
    source: |
      # raw bytes -> string
      raw, rerr = string(.message)
      if rerr != null {
        log("could not decode to string; dropping", level: "warn")
        terminate()
      }

      # Strip leading <PRI> if present (always present for UDM)
      pri = parse_regex!(raw, r'^<(?P<n>\d+)>(?P<rest>.*)$')
      .priority = to_int!(pri.n)
      rest = pri.rest

      # Parse facility/severity from PRI (RFC 3164 §3.3: PRI = facility*8 + severity)
      .facility = to_string(to_int(.priority) / 8)
      .severity = to_string(to_int(.priority) % 8)

      # Parse: "Mmm DD HH:MM:SS HOST TAG REST"
      head, herr = parse_regex(rest, r'^(?P<ts>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?P<host>\S+)\s+(?P<rest>.*)$')
      if herr != null {
        log("could not parse header; dropping: " + rest, level: "warn")
        terminate()
      }
      .host = head.host
      rest2 = head.rest

      # UDM format: TAG is repeated ("9050-Network 9050-Network ..."). Strip one TAG.
      tag_rest, terr = parse_regex(rest2, r'^(\S+)\s+(?P<rest>.*)$')
      if terr != null {
        .appname = "udm"
        body = rest2
      } else {
        .appname = string!(tag_rest.group(0) ?? "udm")
        body = tag_rest.rest
      }

      # Now parse the [CATEGORY-SUB] prefix from the body
      cat, cerr = parse_regex(body, r'^\[(?P<cat>[A-Z_]+)(?:-(?P<sub>[A-Z_0-9-]+))?\] (?P<body>.*)$')
      if cerr == null {
        .labels.event_category = cat.cat
        .labels.event_subcategory = if cat.sub != null { string!(cat.sub) } else { "none" }
        .message = cat.body
      } else {
        .labels.event_category = "unparsed"
        .labels.event_subcategory = "none"
        .message = body
      }

      # Static labels
      .labels.job = "udm-syslog"
      .labels.source = "udm"

  udm_static_labels:
    type: remap
    inputs:
      - udm_parse_rfc3164
    source: |
      .labels.host = string!(.host)
      .labels.app = string!(.appname)
      .labels.severity = .severity
      .labels.facility = .facility

# ---- Sinks ------------------------------------------------------------------
sinks:
  loki:
    type: loki
    inputs:
      - udm_static_labels
    endpoint: "http://loki.ai.svc.cluster.local:3100"
    encoding:
      codec: json
    labels:
      job: "{{ .labels.job }}"
      source: "{{ .labels.source }}"
      host: "{{ .labels.host }}"
      app: "{{ .labels.app }}"
      severity: "{{ .labels.severity }}"
      facility: "{{ .labels.facility }}"
      event_category: "{{ .labels.event_category }}"
      event_subcategory: "{{ .labels.event_subcategory }}"
    batch:
      max_events: 100
      timeout_secs: 2
  console_out:
    type: console
    inputs:
      - udm_static_labels
    encoding:
      codec: json

# ---- Misc -------------------------------------------------------------------
data_dir: /vector-data-dir
api:
  enabled: true
  address: "0.0.0.0:8686"
log_schema:
  host_key: host
  message_key: message
  source_type_key: source_type
  timestamp_key: timestamp
