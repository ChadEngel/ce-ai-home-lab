apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-syslog
  namespace: ai
  labels:
    app: vector-syslog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vector-syslog
  template:
    metadata:
      labels:
        app: vector-syslog
    spec:
      nodeSelector:
        kubernetes.io/hostname: util-server
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
          operator: Exists
      containers:
        - name: vector
          image: timberio/vector:0.46.1-debian
          args:
            - --config
            - /etc/vector/vector.yaml
          ports:
            - name: syslog-udp
              containerPort: 1514
              protocol: UDP
            - name: api
              containerPort: 8686
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: VECTOR_LOG
              value: "info"
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: data
              mountPath: /vector-data-dir
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: data
          emptyDir: {}
