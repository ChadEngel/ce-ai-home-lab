# Bifrost AI Gateway (replaces LiteLLM)
# https://github.com/maximhq/bifrost
#
# OpenAI-compatible API gateway with web UI for provider configuration.
# - Port 8080 (Bifrost default HTTP server)
# - Web UI at / on the Ingress
# - Configure providers (Ollama, OpenRouter, etc.) via the UI after deployment
#
# ---- Post-deploy configuration (Bifrost has no declarative settings here) ----
# After first deploy, configure these in the UI or via the API. They are
# persisted to /app/data/config.db on the PVC, so they survive pod restarts
# but NOT PVC recreation. Re-apply after a fresh deploy or rebuilt PVC.
#
# 1. Providers (Ollama, OpenRouter, etc.) - required for inference.
# 2. log_retention_days: set to 3 (default is 365). The default kept a SQLite
#    log DB on NFS growing unboundedly, which produced lock/fsync stalls that
#    timed out /health. With 3-day retention + a one-time VACUUM, logs.db
#    stays bounded around 500 MB.
#    API: PUT /api/config {"client_config":{"log_retention_days":3}}
#    Restart the pod so the log cleanup routine re-reads the new value.

---
apiVersion: v1
kind: Service
metadata:
  name: bifrost-api
  namespace: ai
spec:
  type: ClusterIP
  selector:
    app: bifrost
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bifrost-pvc
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi

---
# Declarative Bifrost config (git-tracked). Mounted read-only at
# /app/data/config.json -- the path Bifrost's LoadConfig reads (app-dir
# /app/data). Declares the grafana-noc MCP client and the aios-noc Virtual
# Key. Merged with the existing config.db under source_of_truth: split
# (default), so the ce-key / ce-pi-macbook VKs in the DB are preserved.
#
# Do NOT add `"version": 1` to this file: that restores v1.4 semantics where
# an empty allow-list means "allow all". Modern (v1.5+) semantics -- empty =
# deny all -- are what we want, so `version` stays omitted.
#
# subPath mount: edits to this ConfigMap do not hot-reload; restart the pod
# (rollout restart) to apply, which Bifrost requires anyway to re-read config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bifrost-config
  namespace: ai
data:
  config.json: |
    {
      "$schema": "https://www.getbifrost.ai/schema",
      "mcp": {
        "client_configs": [
          {
            "name": "grafana-noc",
            "connection_type": "http",
            "connection_string": "http://mcp-grafana.ai.svc.cluster.local:8000/mcp",
            "auth_type": "none",
            "is_ping_available": true,
            "tools_to_execute": ["*"],
            "tools_to_auto_execute": []
          }
        ]
      },
      "governance": {
        "virtual_keys": [
          {
            "name": "aios-noc",
            "description": "AI NOC agent (R0 read-only). Grant of the grafana-noc MCP client; no tool auto-executes.",
            "is_active": true,
            "allow_all_providers": false,
            "provider_configs": [
              {
                "provider": "openrouter",
                "allowed_models": ["*"],
                "allow_all_keys": true
              },
              {
                "provider": "ollama",
                "allowed_models": ["*"],
                "allow_all_keys": true
              }
            ],
            "mcp_configs": [
              {
                "mcp_client_name": "grafana-noc",
                "tools_to_execute": ["*"]
              }
            ]
          }
        ]
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost
  namespace: ai
  labels:
    app: bifrost
spec:
  replicas: 1
  # Recreate: single replica with config/state on RWO PVC.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bifrost
  template:
    metadata:
      labels:
        app: bifrost
    spec:
      containers:
        - name: bifrost
          # Track upstream releases: `latest` + Always pull.
          # Pod restarts (or rollout restart) pick up the newest build.
          image: maximhq/bifrost:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5
          env:
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: "production"
            - name: BIFROST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: BIFROST_API_KEY
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /app/data/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bifrost-pvc
        - name: config
          configMap:
            name: bifrost-config

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bifrost-ingress
  namespace: ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - llm.caehomelab.com
      secretName: bifrost-tls
  rules:
    - host: llm.caehomelab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bifrost-api
                port:
                  number: 8080
