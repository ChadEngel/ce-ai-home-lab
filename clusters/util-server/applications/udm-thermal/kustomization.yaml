# DEPRECATED 2026-10-09 — see runbooks/udm-thermal-collector-loop.md
#
# The udm-thermal SSH collector was the root cause of weeks of UDM controller
# instability. Even at INTERVAL=60s, 1 SSH/min caused 16+ mcad failures in
# 90s and load spikes to 13. There is no safe INTERVAL short enough to give
# useful thermal data — SSH to UID 0 on the UDM is fundamentally disruptive.
#
# This file is kept as a tombstone so the deployment manifests can be
# resurrected if needed for fan-RPM diagnostics on a known-good UDM. The
# associated InfisicalSecret CR, K8s secret, and ConfigMap have all been
# removed from the cluster. To re-deploy:
#   1. Re-add the InfisicalSecret CR to
#      clusters/util-server/applications/infisical-operator/infisical-secrets-sync.yaml
#   2. Restore this file from git history
#   3. Run scripts/deploy-udm-thermal.sh
#
# Otherwise, monitor UDM thermal data via the unpoller `usg` measurement
# (board temps from the UniFi controller API) — see
# scripts/grafana/dashboards/README.md.
